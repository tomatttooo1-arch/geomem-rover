# Fortress uses ignition.msgs; do not replace with a Garden/Harmonic recipe.
- ros_topic_name: /clock
  gz_topic_name: /world/fpga_room/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /fpga/rgb
  gz_topic_name: /fpga/rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /fpga/depth
  gz_topic_name: /fpga/rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /fpga/camera_info
  gz_topic_name: /fpga/rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
- ros_topic_name: /fpga/points
  gz_topic_name: /fpga/rgbd/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /odom
  gz_topic_name: /fpga/reference_odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /fpga/reference_tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /fpga/cmd_vel_safe
  gz_topic_name: /fpga/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ
